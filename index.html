<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>💣 数字炸弹 · 猜4位数</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            background: #0b1a2a;
        }

        body {
            background: linear-gradient(145deg, #0b1a2a 0%, #1b2c3f 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            padding: max(0.75rem, env(safe-area-inset-left)) max(0.75rem, env(safe-area-inset-right));
            min-height: 100vh;
            min-height: 100dvh;
        }

        .game-container {
            background: rgba(22, 34, 48, 0.9);
            backdrop-filter: blur(8px);
            border-radius: 1.8rem;
            box-shadow: 0 25px 40px -10px rgba(0, 0, 0, 0.7), inset 0 1px 3px rgba(255, 255, 255, 0.08);
            padding: 1.5rem 1.2rem 1.2rem;
            max-width: 600px;
            width: 100%;
            border: 1px solid #2e4a62;
            transition: all 0.2s;
        }

        h1 {
            font-size: clamp(1.5rem, 6vw, 2rem);
            font-weight: 600;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            color: #e3eef9;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
            margin-bottom: 0.3rem;
        }

        h1 span {
            font-size: clamp(1.8rem, 7vw, 2.2rem);
            filter: drop-shadow(0 0 6px #ffb347);
        }

        .subhead {
            text-align: center;
            color: #8aa9c9;
            font-size: clamp(0.75rem, 3.5vw, 0.95rem);
            margin-bottom: 1.4rem;
            border-bottom: 1px dashed #2a4055;
            padding-bottom: 0.8rem;
        }

        .subhead kbd {
            background: #1e3347;
            border-radius: 30px;
            padding: 0.15rem 0.7rem;
            font-weight: 600;
            color: #b8d4f0;
            font-size: 0.8em;
            border: 1px solid #3f617f;
            display: inline-block;
            margin: 0.15rem 0;
        }

        /* 输入 + 按钮 区域 — 小屏自动堆叠 */
        .input-area {
            display: flex;
            gap: 0.7rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            align-items: stretch;
        }

        .input-area input {
            flex: 1 1 150px;
            min-width: 0;
            background: #0f1c28;
            border: 2px solid #2e4e6b;
            border-radius: 60px;
            padding: 0.8rem 1rem;
            font-size: clamp(1.4rem, 6vw, 1.8rem);
            font-weight: 700;
            letter-spacing: 0.35rem;
            text-align: center;
            color: #d0e6ff;
            outline: none;
            transition: 0.2s;
            font-family: 'Courier New', monospace;
            box-shadow: inset 0 5px 8px rgba(0, 0, 0, 0.5);
            width: 100%;
        }

        .input-area input:focus {
            border-color: #5d9bd6;
            box-shadow: 0 0 0 4px rgba(93, 155, 214, 0.2), inset 0 5px 8px #00000070;
            background: #112231;
        }

        .input-area input::placeholder {
            color: #4f6f8c;
            letter-spacing: 0.2rem;
            font-size: 0.9rem;
            font-weight: 400;
            opacity: 0.6;
        }

        .input-area button {
            background: linear-gradient(145deg, #2e74b3, #1a4c78);
            border: none;
            border-radius: 60px;
            padding: 0.8rem 1.5rem;
            font-size: clamp(1rem, 4.5vw, 1.2rem);
            font-weight: 600;
            color: white;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 10px 15px -5px #0a1a2a, 0 0 0 1px #4277a3 inset;
            transition: 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 3.4rem;
            flex: 0 1 auto;
            white-space: nowrap;
            touch-action: manipulation;
        }

        .input-area button:hover {
            background: linear-gradient(145deg, #3d8bcf, #206099);
        }

        .input-area button:active {
            transform: scale(0.97);
            background: #1d4e78;
        }

        .input-area button:disabled {
            opacity: 0.5;
            transform: none;
            pointer-events: none;
            filter: grayscale(0.5);
        }

        /* 消息 + 反馈区域 — 手机上堆叠 */
        .message-box {
            background: #0a151f;
            border-radius: 1.5rem;
            padding: 0.9rem 1.1rem;
            margin-bottom: 1.5rem;
            border-left: 6px solid #3f8ab3;
            box-shadow: inset 0 2px 8px #00000050, 0 8px 18px -8px black;
            color: #b9d6f2;
            font-size: clamp(0.9rem, 4vw, 1.1rem);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.6rem;
        }

        .message-box .msg-text {
            flex: 1 1 180px;
            min-width: 0;
            word-break: break-word;
            line-height: 1.4;
        }

        .feedback-badge {
            background: #1d3c55;
            border-radius: 40px;
            padding: 0.35rem 1rem;
            font-weight: 700;
            font-size: clamp(1.3rem, 5vw, 1.7rem);
            color: #ffc857;
            text-shadow: 0 0 10px #ffb30060;
            min-width: 70px;
            text-align: center;
            border: 1px solid #b98a2b;
            letter-spacing: 1px;
            flex-shrink: 0;
            align-self: center;
        }

        .history-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #7d9bb8;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 0.7rem;
            padding: 0 0.2rem;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .history-title button {
            background: transparent;
            border: 1px solid #2b4a64;
            color: #90b3d1;
            border-radius: 30px;
            padding: 0.3rem 1rem;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.15s;
            touch-action: manipulation;
        }

        .history-title button:hover {
            background: #1e3448;
            color: #c9e1fa;
            border-color: #4e7a9e;
        }

        .history-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-height: 220px;
            overflow-y: auto;
            padding-right: 0.2rem;
            -webkit-overflow-scrolling: touch;
        }

        .history-list::-webkit-scrollbar {
            width: 5px;
        }

        .history-list::-webkit-scrollbar-track {
            background: #0d1b26;
            border-radius: 20px;
        }

        .history-list::-webkit-scrollbar-thumb {
            background: #2f5474;
            border-radius: 20px;
        }

        .history-list li {
            background: #10212f;
            padding: 0.6rem 1rem;
            border-radius: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Courier New', monospace;
            font-weight: 600;
            font-size: clamp(1rem, 4.5vw, 1.3rem);
            letter-spacing: 0.25rem;
            border: 1px solid #1d3a51;
            color: #b3d0ec;
            box-shadow: 0 2px 5px #00000030;
            animation: fadeSlide 0.2s ease;
            word-break: break-word;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .history-list li span.correct {
            font-size: 0.8rem;
            letter-spacing: normal;
            background: #1b3e58;
            padding: 0.25rem 0.8rem;
            border-radius: 30px;
            font-weight: 700;
            color: #f7c35c;
            border: 1px solid #6b8da8;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .win-message {
            background: #1a4d2e;
            border-left: 6px solid #5bd66b;
            color: #ceffd0;
            font-weight: 600;
        }

        .win-message .feedback-badge {
            background: #1e5c32;
            border-color: #b3ffb3;
            color: #fff4b0;
        }

        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(-6px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .footer-note {
            font-size: 0.7rem;
            text-align: center;
            color: #456f8f;
            margin-top: 1rem;
            opacity: 0.8;
        }

        /* ---------- 小屏精细调整 ---------- */
        @media (max-width: 420px) {
            .game-container {
                padding: 1.2rem 0.9rem 1rem;
                border-radius: 1.5rem;
            }

            .input-area {
                gap: 0.5rem;
                margin-bottom: 1.2rem;
            }

            .input-area input {
                flex: 1 1 100%;
                padding: 0.7rem 0.8rem;
                letter-spacing: 0.3rem;
                font-size: 1.6rem;
            }

            .input-area button {
                flex: 1 1 100%;
                min-height: 3rem;
                padding: 0.7rem 1rem;
                font-size: 1.1rem;
            }

            .message-box {
                padding: 0.7rem 0.9rem;
                gap: 0.5rem;
                border-left-width: 5px;
            }

            .feedback-badge {
                min-width: 55px;
                padding: 0.2rem 0.8rem;
                font-size: 1.4rem;
            }

            .history-list li {
                padding: 0.5rem 0.8rem;
                font-size: 1rem;
                letter-spacing: 0.2rem;
            }

            .history-list li span.correct {
                font-size: 0.7rem;
                padding: 0.2rem 0.6rem;
            }
        }

        /* 大屏微调 */
        @media (min-width: 640px) {
            .game-container {
                padding: 2rem 2rem 1.8rem;
            }
            .input-area input {
                flex: 1 1 200px;
            }
            .input-area button {
                flex: 0 0 auto;
            }
        }

        /* 横屏小高度优化 */
        @media (max-height: 600px) and (orientation: landscape) {
            body {
                align-items: flex-start;
                padding-top: 0.5rem;
                padding-bottom: 0.5rem;
            }
            .game-container {
                padding: 0.8rem 1rem;
                border-radius: 1rem;
            }
            h1 { font-size: 1.3rem; margin-bottom: 0.2rem; }
            .subhead { margin-bottom: 0.6rem; padding-bottom: 0.4rem; font-size: 0.7rem; }
            .message-box { margin-bottom: 0.8rem; padding: 0.5rem 0.8rem; }
            .history-list { max-height: 120px; }
            .input-area { margin-bottom: 0.8rem; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>
            <span>💣</span> 数字炸弹
        </h1>
        <div class="subhead">
            <kbd>4位数字</kbd> 允许重复 · 反馈为“数字且位置都正确”的个数
        </div>

        <!-- 消息 / 反馈区域 -->
        <div id="messageBox" class="message-box">
            <span id="messageText" class="msg-text">输入你的第一个猜测…</span>
            <span id="feedbackBadge" class="feedback-badge">–</span>
        </div>

        <!-- 输入区 -->
        <div class="input-area">
            <input type="text" id="guessInput" placeholder="0000" maxlength="4" inputmode="numeric" pattern="\d*" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
            <button id="guessBtn">↵ 猜</button>
        </div>

        <!-- 历史记录 -->
        <div class="history-title">
            <span>📋 猜测记录</span>
            <button id="resetBtn">🔄 新游戏</button>
        </div>
        <ul id="historyList" class="history-list"></ul>
        <div class="footer-note">数字炸弹 · 第一个玩家模式</div>
    </div>

    <script>
        (function() {
            // ---------- 游戏状态 ----------
            let secret = [];            // 4位数字数组, 如 [3,8,1,7]
            let attempts = [];          // 存储 { guess: '1234', correct: 2 }
            let gameOver = false;

            // DOM 元素
            const guessInput = document.getElementById('guessInput');
            const guessBtn = document.getElementById('guessBtn');
            const messageBox = document.getElementById('messageBox');
            const messageText = document.getElementById('messageText');
            const feedbackBadge = document.getElementById('feedbackBadge');
            const historyList = document.getElementById('historyList');
            const resetBtn = document.getElementById('resetBtn');

            // ---------- 工具函数 ----------
            function generateSecret() {
                let arr = [];
                for (let i = 0; i < 4; i++) {
                    arr.push(Math.floor(Math.random() * 10));
                }
                return arr;
            }

            function countCorrect(secretArr, guessStr) {
                if (guessStr.length !== 4 || !/^\d{4}$/.test(guessStr)) return -1;
                const guessArr = guessStr.split('').map(ch => parseInt(ch, 10));
                let count = 0;
                for (let i = 0; i < 4; i++) {
                    if (secretArr[i] === guessArr[i]) count++;
                }
                return count;
            }

            function renderHistory() {
                if (attempts.length === 0) {
                    historyList.innerHTML = '<li style="justify-content:center; color:#4b6f8e; font-weight:400; letter-spacing:1px; font-size:0.9rem;">还没有猜测，来一局吧</li>';
                    return;
                }
                let html = '';
                for (let i = attempts.length - 1; i >= 0; i--) {
                    const item = attempts[i];
                    html += `<li>
                        <span>${item.guess}</span>
                        <span class="correct">${item.correct} 个正确</span>
                    </li>`;
                }
                historyList.innerHTML = html;
            }

            function resetGame() {
                secret = generateSecret();
                attempts = [];
                gameOver = false;
                guessInput.disabled = false;
                guessBtn.disabled = false;
                guessInput.value = '';
                guessInput.focus();
                messageBox.classList.remove('win-message');
                messageText.textContent = '输入你的第一个猜测…';
                feedbackBadge.textContent = '–';
                renderHistory();
            }

            function handleGuess() {
                if (gameOver) return;

                const rawInput = guessInput.value.trim();
                if (!/^\d{4}$/.test(rawInput)) {
                    messageText.textContent = '❌ 请输入4位数字 (0-9)';
                    feedbackBadge.textContent = '?';
                    guessInput.value = '';
                    guessInput.focus();
                    return;
                }

                const guess = rawInput;
                const correct = countCorrect(secret, guess);

                attempts.push({ guess, correct });
                renderHistory();

                feedbackBadge.textContent = `${correct}`;
                messageText.textContent = `猜测 ${guess} → 位置且数字正确的有`;

                if (correct === 4) {
                    gameOver = true;
                    guessInput.disabled = true;
                    guessBtn.disabled = true;
                    messageBox.classList.add('win-message');
                    messageText.textContent = `🎉 恭喜！就是 ${secret.join('')} ！你赢了！`;
                    feedbackBadge.textContent = '4';
                } else {
                    guessInput.value = '';
                    guessInput.focus();
                }
            }

            function init() {
                resetGame();

                guessBtn.addEventListener('click', handleGuess);
                guessInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        handleGuess();
                    }
                });

                resetBtn.addEventListener('click', () => {
                    resetGame();
                });

                guessInput.addEventListener('input', (e) => {
                    let val = e.target.value;
                    val = val.replace(/\D/g, '');
                    if (val.length > 4) val = val.slice(0, 4);
                    e.target.value = val;
                });

                guessInput.addEventListener('focus', (e) => {
                    e.target.select();
                });

                // 移动端：点击页面空白处收起键盘（可选）
                document.addEventListener('click', (e) => {
                    if (e.target !== guessInput && e.target !== guessBtn &&
                        !guessBtn.contains(e.target) && !guessInput.contains(e.target)) {
                        // 不强制 blur，避免干扰；但可以 blur 来收起键盘
                        // guessInput.blur(); // 可选择
                    }
                });
            }

            window.addEventListener('load', init);
        })();
    </script>
</body>
</html>
